name: Deploy to cPanel

# Le build tourne ici (runner GitHub, sans limite de threads/process) plutôt
# que sur le serveur cPanel, qui a une limite système (CloudLinux LVE) trop
# basse pour le compilateur natif SWC de Next.js — voir historique de
# next.config.ts. Seul le résultat déjà compilé (.next/standalone) est envoyé
# au serveur, qui n'a donc plus jamais besoin de lancer `next build` lui-même.

on:
  push:
    branches: [production]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Write production env
        run: echo "NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}" > .env.production

      - name: Build
        run: npm run build

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust server host key
        run: ssh-keyscan -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Upload standalone build
        run: |
          rsync -az --delete -e "ssh -p ${{ secrets.DEPLOY_PORT }}" \
            .next/standalone/ \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/.next/standalone/"

      - name: Restart app (Passenger)
        run: |
          ssh -p ${{ secrets.DEPLOY_PORT }} "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "mkdir -p '${{ secrets.DEPLOY_PATH }}/tmp' && touch '${{ secrets.DEPLOY_PATH }}/tmp/restart.txt'"
