name: Deploy to cPanel

# Le build tourne ici (runner GitHub, sans limite de threads/process) plutôt
# que sur le serveur cPanel, qui a une limite système (CloudLinux LVE) trop
# basse pour le compilateur natif SWC de Next.js — voir historique de
# next.config.ts. Seul le résultat déjà compilé (.next/standalone) est envoyé
# au serveur, qui n'a donc plus jamais besoin de lancer `next build` lui-même.
#
# Déploiement en FTP, pas SSH : le port SSH externe est fermé/filtré sur cet
# hébergement mutualisé (confirmé injoignable depuis deux réseaux différents),
# le terminal cPanel utilisé jusque-là passe par un canal interne. Le
# fichier .next/standalone/tmp/restart.txt (voir scripts/copy-standalone-assets.mjs)
# est régénéré à chaque build et uploadé avec le reste : Passenger redémarre
# l'app dès que son horodatage change, sans avoir besoin d'un `touch` distant.

on:
  push:
    branches: [production]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Write production env
        run: echo "NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}" > .env.production

      - name: Build
        run: npm run build

      - name: Upload standalone build via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ vars.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: .next/standalone/
          server-dir: ./.next/standalone/
